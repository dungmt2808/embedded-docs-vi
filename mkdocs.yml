site_name: Ghi chép Embedded Linux
site_description: Ghi chép quá trình học Embedded Linux, kernel driver, Yocto và RTOS bằng tiếng Việt
site_author: <tên cậu>
site_url: https://<username>.github.io/<repo>/
repo_url: https://github.com/<username>/<repo>
repo_name: <username>/<repo>
edit_uri: edit/main/docs/

copyright: >
  Nội dung theo giấy phép
  <a href="https://creativecommons.org/licenses/by-sa/3.0/">CC BY-SA 3.0</a> —
  một số phần dịch và phóng tác từ tài liệu đào tạo của
  <a href="https://bootlin.com/docs/">Bootlin</a> (CC BY-SA 3.0).

theme:
  name: material
  custom_dir: overrides
  language: vi
  font:
    text: Be Vietnam Pro
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Chuyển sang nền tối
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Chuyển sang nền sáng
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.action.edit

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.arithmatex:
      generic: true

plugins:
  - search:
      lang:
        - vi
        - en
  - tags

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/<username>
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/<username>
  # Giscus — lấy các giá trị dưới tại https://giscus.app
  # Yêu cầu: repo public + bật Discussions + cài giscus app
  giscus:
    repo: <username>/<repo>
    repo_id: <repo_id>
    category: Comments
    category_id: <category_id>

