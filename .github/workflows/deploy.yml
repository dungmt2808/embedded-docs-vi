# Đặt file này tại: <repo>/.github/workflows/deploy.yml
#
# Sau lần chạy đầu tiên:
#   Settings → Pages → Source: "Deploy from a branch" → chọn nhánh gh-pages, thư mục /(root)
#
# Yêu cầu file requirements.txt ở gốc repo với nội dung tối thiểu:
#   mkdocs-material

name: Deploy docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # cần full history để plugin git-revision-date hoạt động (nếu bật sau này)
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Cài dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build & deploy
        run: mkdocs gh-deploy --force
